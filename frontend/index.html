<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research & Code Assistant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 800px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80%; }
        .chat-header { padding: 20px; background: #2563eb; color: white; border-top-left-radius: 8px; border-top-right-radius: 8px; text-align: center; font-weight: bold; font-size: 1.2rem; display: flex; flex-direction: column; gap: 10px; }
        .ingest-form { display: flex; gap: 10px; justify-content: center; }
        .ingest-form input { padding: 8px; border-radius: 4px; border: none; width: 60%; font-size: 0.9rem; }
        .ingest-form button { padding: 8px 16px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .ingest-form button:hover { background: #059669; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; white-space: pre-wrap; }
        .user-message { background: #e5e7eb; align-self: flex-end; color: #1f2937; }
        .bot-message { background: #dbeafe; align-self: flex-start; color: #1e40af; border: 1px solid #bfdbfe; }
        .system-message { background: #fef3c7; align-self: center; color: #92400e; border: 1px solid #fde68a; font-size: 0.9rem; text-align: center; }
        .chat-input-container { display: flex; padding: 20px; border-top: 1px solid #e5e7eb; }
        #chat-input { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 1rem; }
        #send-btn { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 4px; margin-left: 10px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        #send-btn:hover { background: #1d4ed8; }
        .loading { font-style: italic; color: #6b7280; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div>AI Research & Code Assistant (Agentic RAG)</div>
            <div class="ingest-form">
                <input type="text" id="repo-url" placeholder="https://github.com/username/repo">
                <button onclick="ingestRepo()">+ Add GitHub Repo</button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">Hello! I can answer questions about research papers and codebases. What would you like to know?</div>
        </div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Ask a question..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = "http://192.168.51.69:8000"; // Remote Server IP

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function ingestRepo() {
            const urlInput = document.getElementById("repo-url");
            const repoUrl = urlInput.value.trim();
            if (!repoUrl) return;

            urlInput.value = '';
            addMessage(`Instructed server to ingest: ${repoUrl}`, 'system-message');

            try {
                const response = await fetch(`${API_URL}/ingest_repo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repo_url: repoUrl })
                });
                const data = await response.json();
                addMessage(data.message, 'system-message');
            } catch (error) {
                addMessage("Failed to reach server to start ingestion.", 'system-message');
            }
        }

        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user-message');
            input.value = '';

            const loadingId = addMessage("Analyzing query and routing to agents...", 'bot-message loading');

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: message })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();
                addMessage(data.response, 'bot-message');
            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage("Error connecting to the backend. Is the FastAPI server running?", 'bot-message');
            }
        }

        function addMessage(text, className) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            
            const container = document.getElementById("chat-messages");
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
